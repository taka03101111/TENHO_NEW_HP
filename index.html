<script type="text/babel">
function App() {
  const [activeId, setActiveId] = React.useState('top');
  const [scrolled, setScrolled] = React.useState(false);

  // Scroll-spy: pick the section whose top crosses ~25% of viewport
  React.useEffect(() => {
    const ids = window.NAV_ITEMS.map(n => n.id);

    const onScroll = () => {
      setScrolled(window.scrollY > 24);
      const probe = window.innerHeight * 0.32;
      let current = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) continue;
        const rect = el.getBoundingClientRect();
        if (rect.top <= probe) current = id;
      }
      setActiveId(current);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Reveal-on-scroll observer
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('in'));
      return;
    }
    const io = new IntersectionObserver((entries) => {
      for (const ent of entries) {
        if (ent.isIntersecting) {
          ent.target.classList.add('in');
          io.unobserve(ent.target);
        }
      }
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  });

  return (
    <React.Fragment>
      <Header activeId={activeId} scrolled={scrolled} />
      <main>
        <Top />
        <Vision />
        <How />
